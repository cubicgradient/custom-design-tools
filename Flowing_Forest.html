        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Martian Mono', monospace !important; }
        body { background: #0a0a0a; color: #fff; display: flex; height: 100vh; overflow: hidden; padding: 20px; }

        #canvas-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            padding: 20px; background: #000; overflow: hidden;
            border-radius: 12px; border: 1px solid #222;
        }
        canvas { border: 1px solid #333; max-width: 100%; max-height: 100%; object-fit: contain; }

        #controls {
            background: #111; padding: 0; width: 410px; height: 100%;
            overflow: hidden; border: 1px solid #222; margin-left: 20px;
            border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
        }
        #controls-content { flex: 1; overflow-y: auto; padding: 25px; padding-bottom: 10px; }
        #controls-content::-webkit-scrollbar { display: none; }

        #controls-footer {
            background: #111; border-top: 1px solid #222;
            padding: 18px 25px; display: flex; flex-direction: column; gap: 8px;
        }
        .footer-row { display: flex; gap: 10px; align-items: center; }
        .footer-col-left { width: 170px; display: flex; align-items: center; flex-shrink: 0; }
        .footer-row-buttons { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        #animate-toggle { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; }
        #animate-toggle::before { content: '▶'; font-size: 10px; transition: all 0.2s; }
        #animate-toggle.playing::before { content: '⏸'; }
        #controls-footer label { font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700; margin: 0; cursor: pointer; white-space: nowrap; }
        #controls-footer input[type="checkbox"] { margin-right: 8px; cursor: pointer; }

        .section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #222; }
        .section-title { font-size: 13px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; }
        .control { margin-bottom: 14px; }
        label { font-size: 10px; color: #888; text-transform: uppercase; display: block; margin-bottom: 6px; font-weight: 300; }
        input[type="range"] { width: 100%; accent-color: #fff; cursor: pointer; }
        input[type="text"], select { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; font-size: 11px; }
        input[type="color"] { width: 100%; height: 35px; border: 1px solid #333; cursor: pointer; background: #1a1a1a; border-radius: 6px; }
        button { width: 100%; background: #fff; color: #000; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; margin-top: 10px; }
        button:hover { background: #e0e0e0; }
        .val { color: #fff; font-weight: 700; float: right; font-size: 10px; }
        .file-drop-zone { border: 1px dashed #444; border-radius: 6px; padding: 15px; text-align: center; cursor: pointer; background: #161616; font-size: 9px; color: #666; margin-top: 5px; transition: all 0.3s; }
        .file-drop-zone:hover { border-color: #666; background: #1a1a1a; }
        .file-drop-zone.drag-over { border-color: #fff; background: #222; }
        .file-drop-zone.loaded { border-color: #555; color: #aaa; }
        .perf-indicator { font-size: 9px; color: #444; text-align: right; margin-top: 4px; font-weight: 300; }

        .mode-tabs { display: flex; background: #1a1a1a; border-radius: 6px; overflow: hidden; border: 1px solid #333; }
        .mode-tab { flex: 1; padding: 9px 6px; font-size: 9px; font-weight: 700; text-transform: uppercase; text-align: center; cursor: pointer; color: #555; transition: all 0.15s; letter-spacing: 0.3px; }
        .mode-tab.active { background: #fff; color: #000; }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="canvas" width="1190" height="1683"></canvas>
</div>

<div id="controls">
    <div id="controls-content">

        <!-- ① TYPE ──────────────────────────────────────── -->
        <div class="section">
            <div class="section-title">Type</div>
            <div class="control">
                <label>Input Mode</label>
                <div class="mode-tabs">
                    <div class="mode-tab active" id="tab-text" onclick="setInputMode('text')">Text</div>
                    <div class="mode-tab" id="tab-svg" onclick="setInputMode('svg')">SVG Upload</div>
                </div>
            </div>
            <div id="group-text">
                <div class="control">
                    <label>Text (| = line break)</label>
                    <input type="text" id="text" value="Ever-Flowing|Forest" style="font-family:Doran,monospace;font-size:16px;">
                </div>
                <div class="control">
                    <label>Upload Font</label>
                    <input type="file" id="custom-font" accept=".ttf,.otf,.woff,.woff2" style="display:none;">
                    <div class="file-drop-zone loaded" id="font-drop">Doran-Regular.otf</div>
                </div>
                <div class="control">
                    <label>Font Size <span class="val" id="v-fontsize">159</span></label>
                    <input type="range" id="fontsize" min="20" max="700" value="159">
                </div>
                <div class="control">
                    <label>Line Spacing <span class="val" id="v-linespacing">1.10</span></label>
                    <input type="range" id="linespacing" min="0.5" max="2.5" step="0.05" value="1.1">
                </div>
                <div class="control">
                    <label>Alignment</label>
                    <select id="text-align">
                        <option value="center" selected>Center</option>
                        <option value="left">Left</option>
                        <option value="right">Right</option>
                    </select>
                </div>
            </div>
            <div id="group-svg" style="display:none;">
                <div class="control">
                    <label>Upload Typography SVG</label>
                    <input type="file" id="typo-svg" accept="image/svg+xml,.svg" style="display:none;">
                    <div class="file-drop-zone" id="svg-drop">Click or drag SVG file</div>
                </div>
                <div class="control">
                    <label><input type="checkbox" id="svg-preserve" checked> Preserve SVG Colors</label>
                </div>
                <div class="control" id="svg-color-control" style="display:none;">
                    <label>SVG Color</label>
                    <input type="color" id="svg-color" value="#ffffff">
                </div>
                <div class="control">
                    <label>SVG Scale <span class="val" id="v-svg-scale">780</span>%</label>
                    <input type="range" id="svg-scale" min="10" max="30000" step="10" value="780">
                </div>
            </div>
            <div class="control">
                <label>Type Color</label>
                <input type="color" id="type-color" value="#000000">
            </div>
            <div class="control">
                <label>Offset X <span class="val" id="v-tx">24</span></label>
                <input type="range" id="text-x" min="-400" max="400" value="24">
            </div>
            <div class="control">
                <label>Offset Y <span class="val" id="v-ty">11</span></label>
                <input type="range" id="text-y" min="-300" max="300" value="11">
            </div>
        </div>

        <!-- ② PHOTO ─────────────────────────────────────── -->
        <div class="section">
            <div class="section-title">Photo</div>
            <div class="control">
                <label>Upload Photo</label>
                <input type="file" id="photo-upload" accept="image/*" style="display:none;">
                <div class="file-drop-zone" id="photo-drop">Click or drag image file</div>
            </div>
            <div id="group-photo" style="display:none;">
                <div class="control">
                    <label>Blend Mode</label>
                    <select id="photo-blend">
                        <option value="over-fabric" selected>Over Fabric — under type</option>
                        <option value="replace-fabric">Replace Fabric</option>
                        <option value="everywhere">Everywhere — over all</option>
                    </select>
                </div>
                <div class="control">
                    <label>Opacity <span class="val" id="v-photo-opacity">100</span>%</label>
                    <input type="range" id="photo-opacity" min="0" max="100" value="100">
                </div>
                <div class="control">
                    <label>Scale <span class="val" id="v-photo-scale">100</span>%</label>
                    <input type="range" id="photo-scale" min="10" max="300" value="100">
                </div>
                <div class="control">
                    <label>Offset X <span class="val" id="v-photo-x">0</span></label>
                    <input type="range" id="photo-x" min="-500" max="500" value="0">
                </div>
                <div class="control">
                    <label>Offset Y <span class="val" id="v-photo-y">0</span></label>
                    <input type="range" id="photo-y" min="-500" max="500" value="0">
                </div>
                <button onclick="removePhoto()" style="background:#222;color:#888;border:1px solid #333;margin-top:4px;">Remove Photo</button>
            </div>
        </div>

        <!-- ③ FABRIC ────────────────────────────────────── -->
        <div class="section">
            <div class="section-title">Fabric</div>
            <div class="control">
                <label>Fabric Color</label>
                <input type="color" id="flag-color" value="#e8382b">
            </div>
            <div class="control">
                <label><input type="checkbox" id="flag-gradient"> Fabric Gradient</label>
            </div>
            <div id="group-flag-gradient" style="display:none;">
                <div class="control">
                    <label>Fabric Color 2</label>
                    <input type="color" id="flag-color2" value="#001a80">
                </div>
                <div class="control">
                    <label>Gradient Direction</label>
                    <select id="flag-gradient-type">
                        <option value="horizontal">Horizontal</option>
                        <option value="vertical">Vertical</option>
                        <option value="diagonal" selected>Diagonal</option>
                        <option value="radial">Radial — center</option>
                        <option value="radial-inv">Radial — edge</option>
                    </select>
                </div>
            </div>
            <div class="control">
                <label>Width <span class="val" id="v-fw">82</span>%</label>
                <input type="range" id="flag-w" min="20" max="100" value="82">
            </div>
            <div class="control">
                <label>Height <span class="val" id="v-fh">74</span>%</label>
                <input type="range" id="flag-h" min="10" max="100" value="74">
            </div>
            <div class="control">
                <label>Offset X <span class="val" id="v-fx">12</span>%</label>
                <input type="range" id="flag-x" min="0" max="45" value="12">
            </div>
            <div class="control">
                <label>Offset Y <span class="val" id="v-fy">12</span>%</label>
                <input type="range" id="flag-y" min="0" max="45" value="12">
            </div>
        </div>

        <!-- ③ WAVE MOTION ───────────────────────────────── -->
        <div class="section">
            <div class="section-title">Wave Motion</div>
            <div class="control">
                <label>Type</label>
                <select id="dist-type">
                    <option value="flagwave">Flag Wave</option>
                    <option value="wave">Multi-Wave</option>
                    <option value="perlin">Perlin</option>
                    <option value="flow">Flow Field</option>
                    <option value="turbulence" selected>Turbulence</option>
                </select>
            </div>
            <div class="control">
                <label>Anchor</label>
                <select id="anchor">
                    <option value="left">Left Edge (Flagpole)</option>
                    <option value="right">Right Edge</option>
                    <option value="center">Center Pinch</option>
                    <option value="none" selected>None (Free Float)</option>
                </select>
            </div>
            <div class="control">
                <label>Intensity <span class="val" id="v-intensity">52</span></label>
                <input type="range" id="intensity" min="0" max="600" step="1" value="52">

<script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');

    let params = {
        flagColor: '#e8382b', bgColor: '#0000ff', typeColor: '#000000',
        typeBlend: 0,
        flagGradient: false, flagColor2: '#001a80', flagGradientType: 'diagonal',
        bgGradient: false, bgColor2: '#2d0a2e',
        bgGradientType: 'diagonal',
        bgWaveLight: false, bgWaveLightStrength: 5, bgLightSpeed: 0.24,
        shadowColor: '#000000', lightColor: '#b5aa5e',
        svgColor: '#ffffff',
        flagW: 0.82, flagH: 0.74, flagX: 0.12, flagY: 0.12,
        anchor: 'none', distType: 'turbulence',
        intensity: 52, scale: 0.006, speed: 0.19, complex: 3,
        inputMode: 'text', displayMode: 'punch',
        text: 'Ever-Flowing|Forest', fontSize: 159, lineSpacing: 1.1,
        textAlign: 'center', textX: 24, textY: 11,
        fontWeight: '400', customFont: 'Doran', svgScale: 780, svgPreserveColors: true,
        depthShading: true, shadingStrength: 121, ambient: -3,
        showPole: true, poleColor: '#8a8a8a', poleWidth: 7,
        animate: true, transparentBg: false,
        quality: 0.5, exportScale: 2,
        loopDuration: 0,
        fabricFade: false, fabricFadeDuration: 3.0, fabricFadeLoop: false, fabricFadeHold: 1.0,
        photoEnabled: false, photoOpacity: 1.0, photoBlend: 'over-fabric',
        photoX: 0, photoY: 0, photoScale: 100,
    };

    let time = 0, animId = null;
    let animWallStart = null; // wall-clock reference for real-time advance
    let svgImage = null;
    let photoImage = null;     // uploaded photo
    let photoPixels = null;    // raw RGBA data of photo at native resolution
    let photoNW = 0, photoNH = 0; // native photo dimensions
    let isRecording = false, activeRecorder = null;

    // Render buffers — recreated on size change
    let renderCanvas = document.createElement('canvas');
    let renderCtx    = renderCanvas.getContext('2d');
    let dispBufX = null, dispBufY = null, imageDataBuf = null;
    let renderW = 0, renderH = 0;

    // Mask — recreated when typography or flag params change
    let maskData = null, maskW = 0, maskH = 0;

    // ── Math helpers ─────────────────────────────────────────────────────────────
    function hexToRgb(hex) {
        const v = parseInt(hex.replace('#',''), 16);
        return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
    }
    function clamp(v) { return v < 0 ? 0 : v > 255 ? 255 : (v + 0.5) | 0; }
    function noise(x, y, z) {
        return (Math.sin(x * 0.1) * Math.cos(y * 0.1) + Math.sin(y * 0.1 + z) * Math.cos(x * 0.1)) * 0.5;
    }

    // ── Seamless loop: snap speed to nearest frequency that completes full cycles in loopDuration ──
    // For sine-based waves: D * speed * baseFreq must be integer
    // For noise-based waves: D * speed must be multiple of 2π (noise natural period)
    function snapSpeed(speed, loopDuration, distType) {
        if (!loopDuration || speed <= 0) return speed;
        const D = loopDuration;
        let period;
        if      (distType === 'flagwave')  period = 1 / 0.55;   // base harmonic f=0.55
        else if (distType === 'wave')      period = 1 / 0.5;    // base harmonic f=0.5
        else                               period = 2 * Math.PI; // noise z-period
        const N = Math.max(1, Math.round(speed * D / period));
        return N * period / D;
    }

    // ── Distortion field ─────────────────────────────────────────────────────────
    function distort(x, y, t) {
        let dx = 0, dy = 0;
        const { distType: dt, intensity: I, scale: sc, complex: cx } = params;
        const sp = snapSpeed(params.speed, params.loopDuration, dt);
        if (dt === 'flagwave') {
            for (let i = 0; i < cx; i++) {
                const f = (i + 1) * 0.55, a = I / Math.pow(1.6, i);
                const phase = (t * sp * f) - (x * sc * 3.5 * f);
                dy += Math.sin(phase * Math.PI * 2) * a;
                dx += Math.cos(phase * Math.PI * 2 + 1.1) * a * 0.08;
            }
        } else if (dt === 'wave') {
            for (let i = 0; i < cx; i++) {
                const f = (i+1)*0.5, a = I/(i+1), p = t*sp*(1+i*0.3);
                dx += Math.sin((y*sc*f+p)*Math.PI*2)*a;
                dy += Math.cos((x*sc*f*0.7+p*0.8)*Math.PI*2)*a*0.6;
            }
        } else if (dt === 'perlin') {
            for (let i = 0; i < cx; i++) {
                const f = Math.pow(2,i), a = 1/f;
                dx += noise(x*sc*f+t*sp, y*sc*f, 0)*I*a;
                dy += noise(x*sc*f+1000, y*sc*f+1000, t*sp*0.5)*I*a;
            }
        } else if (dt === 'flow') {
            const eps = 2;
            for (let i = 0; i < cx; i++) {
                const f=(i+1)*0.8, a=I/(i+1), tx=t*sp;
                dx += (noise(x*sc*f,(y+eps)*sc*f,tx) - noise(x*sc*f,(y-eps)*sc*f,tx))*a*3;
                dy += -(noise((x+eps)*sc*f,y*sc*f,tx) - noise((x-eps)*sc*f,y*sc*f,tx))*a*3;
            }
        } else if (dt === 'turbulence') {
            for (let i = 0; i < cx; i++) {
                const f=Math.pow(2,i), a=I/f;
                const angle = noise(x*sc*f, y*sc*f, t*sp)*Math.PI*4;
                dx += Math.cos(angle)*a; dy += Math.sin(angle)*a;
            }
        }
        return { dx, dy };
    }

    function anchorFactor(x, flagL, flagWpx) {
        const a = params.anchor;
        if (a === 'left')   return Math.max(0, Math.min(1, (x - flagL) / flagWpx));
        if (a === 'right')  return Math.max(0, Math.min(1, (flagL + flagWpx - x) / flagWpx));
        if (a === 'center') return Math.max(0, Math.min(1, Math.abs((x - flagL) / flagWpx - 0.5) * 2));
        return 1;
    }

    // ── Mask (typography stencil) ────────────────────────────────────────────────
    // W, H are the render dimensions (may differ from canvas for quality scaling)
    function buildMask(W, H) {
        const mc = document.createElement('canvas');
        mc.width = W; mc.height = H;
        const mctx = mc.getContext('2d');
        mctx.clearRect(0, 0, W, H);

        // Scale factor from canvas coords to render coords
        const q = W / canvas.width;

        if (params.inputMode === 'svg' && svgImage) {
            const sw = svgImage.naturalWidth  || svgImage.width  || W;
            const sh = svgImage.naturalHeight || svgImage.height || H;
            const scale = (params.svgScale / 100) * q;
            const dw = sw * scale, dh = sh * scale;
            const dx = (W - dw) / 2 + params.textX * q;
            const dy = (H - dh) / 2 + params.textY * q;
            mctx.drawImage(svgImage, dx, dy, dw, dh);
        } else {
            mctx.fillStyle = '#fff';
            const lines  = params.text.split('|');
            const fSize  = params.fontSize * q;
            const lineH  = fSize * params.lineSpacing;
            const totalH = lineH * lines.length;
            const startY = (H - totalH) * 0.5 + lineH * 0.5 + params.textY * q;
            const flagL  = params.flagX * W;
            const flagWpx = params.flagW * W;
            mctx.font = `${params.fontWeight} ${fSize}px ${params.customFont}, Arial`;
            mctx.textBaseline = 'middle';
            lines.forEach((line, i) => {
                const y = startY + i * lineH;
                if (params.textAlign === 'center') {
                    mctx.textAlign = 'center';
                    mctx.fillText(line, W * 0.5 + params.textX * q, y);
                } else if (params.textAlign === 'left') {
                    mctx.textAlign = 'left';
                    mctx.fillText(line, flagL + 10 + params.textX * q, y);
                } else {
                    mctx.textAlign = 'right';
                    mctx.fillText(line, flagL + flagWpx - 10 + params.textX * q, y);
                }
            });
        }

        maskData = mctx.getImageData(0, 0, W, H).data;
        maskW = W; maskH = H;
    }

    // ── Buffer allocation ────────────────────────────────────────────────────────
    function ensureBuffers(W, H) {
        if (renderCanvas.width !== W || renderCanvas.height !== H ||
            !dispBufX || dispBufX.length !== W * H) {
            renderCanvas.width = W; renderCanvas.height = H;
            renderCtx    = renderCanvas.getContext('2d');
            dispBufX     = new Float32Array(W * H);
            dispBufY     = new Float32Array(W * H);
            imageDataBuf = renderCtx.createImageData(W, H);
            renderW = W; renderH = H;
            maskData = null;
        }
    }

    // ── Background gradient position helper (returns 0–1) ────────────────────────
    function bgGradT(x, y, W, H, type) {
        if (type === 'radial') {
            const cx = W*0.5, cy = H*0.5;
            const maxR = Math.sqrt(cx*cx + cy*cy);
            return Math.min(1, Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy)) / maxR);
        } else if (type === 'horizontal') {
            return x / W;
        } else if (type === 'vertical') {
            return y / H;
        } else if (type === 'diagonal') {
            return (x/W + y/H) * 0.5;
        } else if (type === 'radial-inv') {
            const cx = W*0.5, cy = H*0.5;
            const maxR = Math.sqrt(cx*cx + cy*cy);
            return 1 - Math.min(1, Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy)) / maxR);
        }
        return 0;
    }

    // ── Bilinear photo sampler ────────────────────────────────────────────────────
    // Samples photoPixels at float (u,v) in photo pixel space, returns [r,g,b,a]
    function samplePhoto(u, v) {
        const x0 = u | 0, y0 = v | 0;
        const x1 = Math.min(x0 + 1, photoNW - 1);
        const y1 = Math.min(y0 + 1, photoNH - 1);
        const fx = u - x0, fy = v - y0;
        const w00 = (1-fx)*(1-fy), w10 = fx*(1-fy), w01 = (1-fx)*fy, w11 = fx*fy;
        const p00 = ((y0 * photoNW + x0) << 2);
        const p10 = ((y0 * photoNW + x1) << 2);
        const p01 = ((y1 * photoNW + x0) << 2);
        const p11 = ((y1 * photoNW + x1) << 2);
        const d = photoPixels;
        return [
            d[p00]*w00 + d[p10]*w10 + d[p01]*w01 + d[p11]*w11,
            d[p00+1]*w00 + d[p10+1]*w10 + d[p01+1]*w01 + d[p11+1]*w11,
            d[p00+2]*w00 + d[p10+2]*w10 + d[p01+2]*w01 + d[p11+2]*w11,
            d[p00+3]*w00 + d[p10+3]*w10 + d[p01+3]*w01 + d[p11+3]*w11,
        ];
    }

    // ── Core pixel render ────────────────────────────────────────────────────────
    function renderFrame(W, H) {
        if (!maskData || maskW !== W || maskH !== H) buildMask(W, H);

        const [fr, fg, fb] = hexToRgb(params.flagColor);
        const [fr2, fg2, fb2] = hexToRgb(params.flagColor2);
        const [bgr, bgg, bgb] = hexToRgb(params.bgColor);
        const activeTypeColor = params.inputMode === 'svg' ? params.svgColor : params.typeColor;
        const [tr, tg, tb]    = hexToRgb(activeTypeColor);
        const [shr, shg, shb] = hexToRgb(params.shadowColor);
        const [lhr, lhg, lhb] = hexToRgb(params.lightColor);
        const blend = params.typeBlend / 100;
        const doFlagGrad = params.flagGradient;
        const preserveSvg = params.inputMode === 'svg' && params.svgPreserveColors && svgImage;

        // Unified display: fadeT 0=punch, 1=type-only, fractional=cross-fade
        const fadeT = computeFabricFadeT(time);

        // Photo layer pre-computation
        const doPhoto = params.photoEnabled && photoPixels !== null;
        const _renderScale = W / canvas.width;
        let photoScaleX = 0, photoScaleY = 0, photoCX = 0, photoCY = 0;
        if (doPhoto) {
            const sc = params.photoScale / 100;
            const baseScale = photoNW / W;
            photoScaleX = baseScale / sc;
            photoScaleY = baseScale / sc;
            // Offsets are in canvas pixels — scale to render space
            photoCX = W * 0.5 + params.photoX * _renderScale;
            photoCY = H * 0.5 + params.photoY * _renderScale;
        }

        const flagL   = params.flagX * W;
        const flagT   = params.flagY * H;
        const flagWpx = params.flagW * W;
        const flagHpx = params.flagH * H;
        const flagR   = flagL + flagWpx;
        const flagB   = flagT + flagHpx;

        const t = time;
        const doShading = params.depthShading;
        const SS  = params.shadingStrength;
        const amb = params.ambient;
        const useTransp = params.transparentBg;

        // Pre-decode second bg color for gradient
        const [bgr2, bgg2, bgb2] = hexToRgb(params.bgColor2);
        const doBgGrad  = params.bgGradient && !useTransp;
        const doBgLight = params.bgWaveLight && !useTransp;
        const bgLightStr = params.bgWaveLightStrength * 0.25;
        // Rotating light direction — slow orbit over time
        const lightAngle = time * params.bgLightSpeed;
        const lightCos   = Math.cos(lightAngle);
        const lightSin   = Math.sin(lightAngle);

        // Pass 1 — sparse displacement grid + bilinear interpolation
        // STEP adapts to intensity: high displacement = smaller grid = more samples
        const STEP = Math.max(1, Math.min(6, Math.floor(330 / Math.max(params.intensity, 1))));
        const gW = (W / STEP + 2) | 0;
        const gH = (H / STEP + 2) | 0;

        // Reuse persistent grid buffers, reallocate only on size change
        if (!renderFrame._gX || renderFrame._gX.length < gW * gH) {
            renderFrame._gX = new Float32Array(gW * gH);
            renderFrame._gY = new Float32Array(gW * gH);
        }
        const gX = renderFrame._gX, gY = renderFrame._gY;

        // Resolution-independence: distortion is computed in CANVAS space so the
        // wave pattern is identical at any render/export resolution.
        const renderScale = W / canvas.width;   // 1 = preview full, S = export, q = quality
        const invScale = 1 / renderScale;

        for (let gy = 0; gy < gH; gy++) {
            const py = gy * STEP;
            for (let gx = 0; gx < gW; gx++) {
                const px = gx * STEP;
                const d  = distort(px * invScale, py * invScale, t); // canvas-space coords
                const af = anchorFactor(px, flagL, flagWpx);          // ratios — scale-agnostic
                const gi = gy * gW + gx;
                gX[gi] = d.dx * af * renderScale;  // displacement back to render space
                gY[gi] = d.dy * af * renderScale;
            }
        }

        // Bilinear fill of dispBufX/Y from grid
        for (let y = 0; y < H; y++) {
            const gy0 = (y / STEP) | 0;
            const gy1 = Math.min(gy0 + 1, gH - 1);
            const ty  = (y - gy0 * STEP) / STEP;
            const ty0 = 1 - ty;
            const row0 = gy0 * gW, row1 = gy1 * gW;
            const rowD = y * W;

            for (let x = 0; x < W; x++) {
                const gx0 = (x / STEP) | 0;
                const gx1 = Math.min(gx0 + 1, gW - 1);
                const tx  = (x - gx0 * STEP) / STEP;
                const tx0 = 1 - tx;

                const i00 = row0 + gx0, i01 = row0 + gx1;
                const i10 = row1 + gx0, i11 = row1 + gx1;

                const i = rowD + x;
                dispBufX[i] = gX[i00]*tx0*ty0 + gX[i01]*tx*ty0 + gX[i10]*tx0*ty + gX[i11]*tx*ty;
                dispBufY[i] = gY[i00]*tx0*ty0 + gY[i01]*tx*ty0 + gY[i10]*tx0*ty + gY[i11]*tx*ty;
            }
        }

        // Pass 2 — pixel color
        const px = imageDataBuf.data;

        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                const i    = y * W + x;
                const dxA  = dispBufX[i];
                const dyA  = dispBufY[i];
                // Inverse warp: find origin on flat flag
                const ox   = x - dxA;
                const oy   = y - dyA;
                const pidx = i << 2;

                // ── Flag boundary — smooth 1.5px falloff instead of hard on/off ──
                const AA = 1.5;
                const edgeL = Math.max(0, Math.min(1, (ox - flagL) / AA));
                const edgeR = Math.max(0, Math.min(1, (flagR - ox) / AA));
                const edgeT = Math.max(0, Math.min(1, (oy - flagT) / AA));
                const edgeB = Math.max(0, Math.min(1, (flagB - oy) / AA));
                // flagAlpha: 0 = fully outside, 1 = fully inside
                const flagAlpha = edgeL * edgeR * edgeT * edgeB;
                const onFlag = flagAlpha > 0;

                // ── Mask lookup — use actual alpha for smooth type edges ──
                let typeAlpha = 0;
                let svgR = tr, svgG = tg, svgB = tb; // default to flat type color
                if (onFlag) {
                    const mx = ox < 0 ? 0 : ox >= maskW ? maskW-1 : ox | 0;
                    const my = oy < 0 ? 0 : oy >= maskH ? maskH-1 : oy | 0;
                    const midx = (my * maskW + mx) << 2;
                    typeAlpha = maskData[midx + 3] / 255;
                    if (preserveSvg && typeAlpha > 0) {
                        // getImageData returns straight (non-premultiplied) alpha,
                        // so the RGB channels are already the true SVG colors
                        svgR = maskData[midx];
                        svgG = maskData[midx + 1];
                        svgB = maskData[midx + 2];
                    }
                }

                // Fold shading (gradient of displacement field)
                let shade = amb;
                if (doShading) {
                    if (x + 2 < W) {
                        const dxN = dispBufX[i+2], dyN = dispBufY[i+2];
                        shade += (dyN - dyA) * SS * -1;
                        shade += (dxN - dxA) * SS * 0.4;
                    }
                    if (y + 2 < H) {
                        shade += (dispBufY[(y+2)*W+x] - dyA) * SS * 0.3;
                    }
                }

                let r, g, b, a = 255;

                // ── Compute background color for this pixel (gradient + wave light) ──
                let bR = bgr, bG = bgg, bB = bgb;
                if (!useTransp) {
                    if (doBgGrad) {
                        const gt = bgGradT(x, y, W, H, params.bgGradientType);
                        bR = (bgr*(1-gt) + bgr2*gt + 0.5)|0;
                        bG = (bgg*(1-gt) + bgg2*gt + 0.5)|0;
                        bB = (bgb*(1-gt) + bgb2*gt + 0.5)|0;
                    }
                    if (doBgLight) {
                        const wl = (dispBufY[i] * lightCos + dispBufX[i] * lightSin) * bgLightStr;
                        if (wl >= 0) {
                            const t = Math.min(1, wl / 160);
                            bR = clamp(bR + (lhr - bR) * t);
                            bG = clamp(bG + (lhg - bG) * t);
                            bB = clamp(bB + (lhb - bB) * t);
                        } else {
                            const t = Math.min(1, -wl / 160);
                            bR = clamp(bR + (shr - bR) * t);
                            bG = clamp(bG + (shg - bG) * t);
                            bB = clamp(bB + (shb - bB) * t);
                        }
                    }
                }

                // ── Photo layer — sampled at inverse-warped position ──────────────
                let phR = 0, phG = 0, phB = 0, phA = 0;
                if (doPhoto) {
                    // Map warp-space (ox,oy) into photo pixel coords
                    const pu = (ox - photoCX) * photoScaleX + photoNW * 0.5;
                    const pv = (oy - photoCY) * photoScaleY + photoNH * 0.5;
                    if (pu >= 0 && pu < photoNW - 1 && pv >= 0 && pv < photoNH - 1) {
                        const s = samplePhoto(pu, pv);
                        phR = s[0]; phG = s[1]; phB = s[2];
                        phA = (s[3] / 255) * params.photoOpacity;
                    }
                }

                // ── Flag surface color: flat or gradient, sampled at cloth-space origin ──
                let fR, fG, fB;
                if (doFlagGrad) {
                    const gt = bgGradT(ox - flagL, oy - flagT, flagWpx, flagHpx, params.flagGradientType);
                    fR = fr  + (fr2  - fr)  * gt;
                    fG = fg  + (fg2  - fg)  * gt;
                    fB = fb  + (fb2  - fb)  * gt;
                } else {
                    fR = fr; fG = fg; fB = fb;
                }

                // Apply photo 'replace-fabric' blend before shading
                if (doPhoto && params.photoBlend === 'replace-fabric' && onFlag) {
                    fR = fR + (phR - fR) * phA;
                    fG = fG + (phG - fG) * phA;
                    fB = fB + (phB - fB) * phA;
                }

                fR = clamp(fR + shade); fG = clamp(fG + shade); fB = clamp(fB + shade);

                const hR = clamp(svgR*(1-blend) + bR*blend);
                const hG = clamp(svgG*(1-blend) + bG*blend);
                const hB = clamp(svgB*(1-blend) + bB*blend);
                const tyR = clamp(svgR + shade), tyG = clamp(svgG + shade), tyB = clamp(svgB + shade);
                const typeOnlyAlpha = flagAlpha * typeAlpha;

                if (useTransp) {
                    const surfA = flagAlpha * (1 - typeAlpha) * (1 - fadeT);
                    const typeA = typeOnlyAlpha;
                    if (fadeT >= 1) {
                        r = tyR; g = tyG; b = tyB; a = clamp(typeA * 255);
                    } else {
                        r = fR; g = fG; b = fB; a = clamp((surfA + typeA * fadeT) * 255);
                    }
                } else {
                    // Punch mode blended into bg
                    const inR = fR + (hR - fR) * typeAlpha;
                    const inG = fG + (hG - fG) * typeAlpha;
                    const inB = fB + (hB - fB) * typeAlpha;
                    const pR = clamp(bR + (inR - bR) * flagAlpha);
                    const pG = clamp(bG + (inG - bG) * flagAlpha);
                    const pB = clamp(bB + (inB - bB) * flagAlpha);
                    // Type-only blended into bg
                    const oR = clamp(bR + (tyR - bR) * typeOnlyAlpha);
                    const oG = clamp(bG + (tyG - bG) * typeOnlyAlpha);
                    const oB = clamp(bB + (tyB - bB) * typeOnlyAlpha);
                    // Cross-fade: fadeT=0 → punch, fadeT=1 → type-only
                    r = clamp(pR + (oR - pR) * fadeT);
                    g = clamp(pG + (oG - pG) * fadeT);
                    b = clamp(pB + (oB - pB) * fadeT);

                    // Apply photo over-fabric or under-type after main composite
                    if (doPhoto && phA > 0) {
                        if (params.photoBlend === 'over-fabric') {
                            // Photo floats above fabric but under type punch
                            const punchBlend = flagAlpha * (1 - typeAlpha) * phA;
                            r = clamp(r + (phR - r) * punchBlend);
                            g = clamp(g + (phG - g) * punchBlend);
                            b = clamp(b + (phB - b) * punchBlend);
                        } else if (params.photoBlend === 'everywhere') {
                            // Photo floats over entire canvas including bg
                            r = clamp(r + (phR - r) * phA);
                            g = clamp(g + (phG - g) * phA);
                            b = clamp(b + (phB - b) * phA);
                        }
                    }
                }

                px[pidx]=r; px[pidx+1]=g; px[pidx+2]=b; px[pidx+3]=a;
            }
        }

        renderCtx.putImageData(imageDataBuf, 0, 0);

        // Flagpole (visible when fabric is showing)
        if (fadeT < 1 && params.showPole && (params.anchor === 'left' || params.anchor === 'right')) {
            const poleX = params.anchor === 'left' ? flagL : flagR;
            renderCtx.save();
            renderCtx.strokeStyle = params.poleColor;
            renderCtx.lineWidth   = params.poleWidth;
            renderCtx.lineCap     = 'round';
            renderCtx.beginPath();
            renderCtx.moveTo(poleX, flagT - 22);
            renderCtx.lineTo(poleX, flagB + 6);
            renderCtx.stroke();
            renderCtx.fillStyle = params.poleColor;
            renderCtx.beginPath();
            renderCtx.arc(poleX, flagT - 22, params.poleWidth * 1.6, 0, Math.PI * 2);
            renderCtx.fill();
            renderCtx.restore();
        }
    }

    // ── Preview loop ─────────────────────────────────────────────────────────────
    // Pure function — same result for same t in both preview and recording
    function computeFabricFadeT(t) {
        if (!params.fabricFade || params.fabricFadeDuration <= 0) {
            return params.displayMode === 'typeonly' ? 1 : 0;
        }
        const D = params.fabricFadeDuration;
        if (!params.fabricFadeLoop) {
            return Math.min(1, t / D);
        }
        // Ping-pong with hold at fully transparent (top)
        const H = params.fabricFadeHold; // hold duration at fadeT=1
        const cycle = 2 * D + H;        // total period: ramp-up + hold + ramp-down
        const phase = t % cycle;
        if (phase < D)         return phase / D;           // ramp 0→1
        if (phase < D + H)     return 1;                   // hold at 1
        return 1 - (phase - D - H) / D;                   // ramp 1→0
    }

    function render() {
        const t0 = performance.now();
        const W = Math.round(canvas.width  * params.quality);
        const H = Math.round(canvas.height * params.quality);
        ensureBuffers(W, H);
        renderFrame(W, H);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = params.quality < 1;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(renderCanvas, 0, 0, canvas.width, canvas.height);
        document.getElementById('perf').textContent = (performance.now() - t0).toFixed(1) + ' ms/frame';
    }

    let lastFrameTime = 0;
    const TARGET_FPS = 30;                 // cap preview at 30fps — half the work of 60
    const FRAME_MIN_MS = 1000 / TARGET_FPS;

    function animate(wallNow) {
        if (params.animate) animId = requestAnimationFrame(animate);

        // Throttle to target FPS — skip frames that arrive too soon
        if (wallNow - lastFrameTime < FRAME_MIN_MS) return;
        lastFrameTime = wallNow;

        // Real elapsed seconds since animation started — no fixed delta drift
        if (animWallStart === null) animWallStart = wallNow;
        const wallElapsed = (wallNow - animWallStart) / 1000;
        time = params.loopDuration > 0
            ? wallElapsed % params.loopDuration
            : wallElapsed;

        render();
    }

    function resetFade() {
        // Shift animWallStart forward so fabricFadeT resets to 0
        animWallStart = null;
        time = 0;
        if (!params.animate) render();
    }

    function toggleAnimation() {
        params.animate = !params.animate;
        const btn = document.getElementById('animate-toggle');
        if (params.animate) {
            // Resume: shift wall start so time continues from where it paused
            animWallStart = null; // will be set on first animate() call using saved time
            // Temporarily seed animWallStart so elapsed = saved time on first frame
            const savedTime = time;
            animWallStart = performance.now() - savedTime * 1000;
            btn.classList.add('playing'); btn.textContent = 'Pause';
            animId = requestAnimationFrame(animate);
        } else {
            btn.classList.remove('playing'); btn.textContent = 'Play';
            if (animId) cancelAnimationFrame(animId);
        }
    }

    // ── Hi-res export ─────────────────────────────────────────────────────────────
    function exportPNG() {
        const wasAnimating = params.animate;
        if (animId) cancelAnimationFrame(animId);
        params.animate = false;

        const scale = params.exportScale;
        // Render at FULL export resolution — every pixel is truly computed.
        // The distortion is resolution-independent (canvas-space coords), so the
        // wave matches the preview exactly while gaining real detail.
        const EW = canvas.width  * scale;
        const EH = canvas.height * scale;

        renderCanvas.width  = EW; renderCanvas.height = EH;
        renderCtx    = renderCanvas.getContext('2d');
        dispBufX     = new Float32Array(EW * EH);
        dispBufY     = new Float32Array(EW * EH);
        imageDataBuf = renderCtx.createImageData(EW, EH);
        renderW = EW; renderH = EH;
        maskData = null; // rebuild mask at full export resolution → crisp type/SVG edges

        renderFrame(EW, EH);

        const ec = document.createElement('canvas');
        ec.width = EW; ec.height = EH;
        ec.getContext('2d').drawImage(renderCanvas, 0, 0);

        const link = document.createElement('a');
        link.download = 'flag-punch-typography.png';
        link.href = ec.toDataURL('image/png');
        link.click();

        // Restore preview-quality buffers
        const pW = Math.round(canvas.width  * params.quality);
        const pH = Math.round(canvas.height * params.quality);
        renderCanvas.width  = pW; renderCanvas.height = pH;
        renderCtx    = renderCanvas.getContext('2d');
        dispBufX     = new Float32Array(pW * pH);
        dispBufY     = new Float32Array(pW * pH);
        imageDataBuf = renderCtx.createImageData(pW, pH);
        renderW = pW; renderH = pH;
        maskData = null;

        params.animate = wasAnimating;
        animWallStart = performance.now() - time * 1000;
        if (wasAnimating) animId = requestAnimationFrame(animate); else render();
    }

    function applyCanvasSize(w, h) {
        w = Math.max(100, Math.min(4000, w));
        h = Math.max(100, Math.min(4000, h));
        canvas.width = w; canvas.height = h;

        const v = Math.max(1, Math.min(20, parseInt(e.target.value) || 2));

        e.target.value = v;
        updateExportInfo();
    });
    document.getElementById('loop-duration').addEventListener('change', e => {
        params.loopDuration = parseInt(e.target.value);
        // Sync video duration slider to loop duration when a loop is set
        if (params.loopDuration > 0) {
            document.getElementById('rec-duration').value = params.loopDuration;
            document.getElementById('v-rec-dur').textContent = params.loopDuration;
        }
    });
    onChk('transparent-bg', 'transparentBg');

    function updateExportInfo() {
        const ew = canvas.width  * params.exportScale;
        const eh = canvas.height * params.exportScale;
        document.getElementById('export-info').textContent = `Export: ${ew}×${eh}`;
    }
    updateExportInfo();

    // Photo upload
    setupDrop('photo-drop', 'photo-upload', file => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            // Cache raw pixel data for fast per-pixel bilinear sampling
            const pc = document.createElement('canvas');
            pc.width = img.naturalWidth; pc.height = img.naturalHeight;
            const pctx = pc.getContext('2d');
            pctx.drawImage(img, 0, 0);
            photoPixels = pctx.getImageData(0, 0, pc.width, pc.height).data;
            photoNW = pc.width; photoNH = pc.height;
            photoImage = img;
            params.photoEnabled = true;
            markLoaded('photo-drop', file.name);
            document.getElementById('group-photo').style.display = '';
            URL.revokeObjectURL(url);
            if (!params.animate) render();
        };
        img.src = url;
    });

    function removePhoto() {
        photoImage = null; photoPixels = null; photoNW = 0; photoNH = 0;
        params.photoEnabled = false;
        document.getElementById('photo-drop').textContent = 'Click or drag image file';
        document.getElementById('photo-drop').classList.remove('loaded');
        document.getElementById('group-photo').style.display = 'none';
        if (!params.animate) render();
    }

    onSel('photo-blend', 'photoBlend');
    document.getElementById('photo-opacity').addEventListener('input', e => {
        params.photoOpacity = parseInt(e.target.value) / 100;
        document.getElementById('v-photo-opacity').textContent = e.target.value;
        if (!params.animate) render();
    });
    document.getElementById('photo-scale').addEventListener('input', e => {
        params.photoScale = parseInt(e.target.value);
        document.getElementById('v-photo-scale').textContent = e.target.value;
        if (!params.animate) render();
    });
    document.getElementById('photo-x').addEventListener('input', e => {
        params.photoX = parseInt(e.target.value);
        document.getElementById('v-photo-x').textContent = e.target.value;
        if (!params.animate) render();
    });
    document.getElementById('photo-y').addEventListener('input', e => {
        params.photoY = parseInt(e.target.value);
        document.getElementById('v-photo-y').textContent = e.target.value;
        if (!params.animate) render();
    });

    // ── Drop zone helper ──────────────────────────────────────────────────────────
    function setupDrop(dropId, inputId, callback) {
        const drop  = document.getElementById(dropId);
        const input = document.getElementById(inputId);
        drop.addEventListener('click', () => input.click());
        input.addEventListener('change', e => { if (e.target.files[0]) callback(e.target.files[0]); });
        drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
        drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
        drop.addEventListener('drop', e => {
            e.preventDefault(); drop.classList.remove('drag-over');
            if (e.dataTransfer.files[0]) callback(e.dataTransfer.files[0]);
        });
    }

    function markLoaded(dropId, name) {
        const el = document.getElementById(dropId);
        el.textContent = name; el.classList.add('loaded');
    }

    // ── Video recording ───────────────────────────────────────────────────────────
    function toggleRecording() {
        if (isRecording) { stopRecording(); return; }
        if (window.VideoEncoder && window.Mp4Muxer) {
            recordMP4();
        } else {
            recordWebM();
        }
    }

    async function recordMP4() {
        const fps         = parseInt(document.getElementById('rec-fps').value);
        const rawDuration = parseFloat(document.getElementById('rec-duration').value);
        const duration    = params.loopDuration > 0 ? params.loopDuration : rawDuration;
        const totalFrames = Math.round(duration * fps);

        // H.264 requires even dimensions
        const W = canvas.width  - (canvas.width  % 2);
        const H = canvas.height - (canvas.height % 2);

        const wasAnimating = params.animate;
        params.animate = false;
        if (animId) cancelAnimationFrame(animId);
        const savedTime = time;
        // Always record from t=0 for a clean loop; or from current time for non-loop
        time = params.loopDuration > 0 ? 0 : savedTime;
        const savedQuality = params.quality;
        params.quality = 1.0;
        ensureBuffers(canvas.width, canvas.height);
        maskData = null;
        isRecording = true;
        updateRecordUI(0, totalFrames);

        const { Muxer, ArrayBufferTarget } = window.Mp4Muxer;
        const muxer = new Muxer({
            target: new ArrayBufferTarget(),
            video: { codec: 'avc', width: W, height: H },
            fastStart: 'in-memory',
        });

        const encoder = new VideoEncoder({
            output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
            error: e => console.error('VideoEncoder error:', e),
        });

        encoder.configure({
            codec:     'avc1.4D4028', // H.264 Main Profile Level 4.0
            width:      W,
            height:     H,
            bitrate:    10_000_000,
            framerate:  fps,
            latencyMode: 'quality',
        });

        for (let frame = 0; frame < totalFrames; frame++) {
            if (!isRecording) break;

            // Render frame
            renderFrame(canvas.width, canvas.height);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(renderCanvas, 0, 0, canvas.width, canvas.height);

            // Capture canvas as VideoFrame, crop to even dimensions
            const vf = new VideoFrame(canvas, {
                timestamp:   Math.round((frame / fps) * 1_000_000),
                duration:    Math.round((1    / fps) * 1_000_000),
                visibleRect: { x: 0, y: 0, width: W, height: H },
            });
            encoder.encode(vf, { keyFrame: frame % (fps * 2) === 0 });
            vf.close();

            time += 1 / fps;
            if (params.loopDuration > 0) time = time % params.loopDuration;
            updateRecordUI(frame + 1, totalFrames);

            // Yield to browser each frame so UI stays responsive
            await new Promise(r => setTimeout(r, 0));
        }

        await encoder.flush();
        muxer.finalize();

        const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
        triggerDownload(blob, 'flag-punch.mp4');

        // Restore
        isRecording = false; activeRecorder = null;
        params.quality = savedQuality; maskData = null;
        time = savedTime;
        params.animate = wasAnimating;
        animWallStart = performance.now() - savedTime * 1000;
        updateRecordUI(0, 0);
        if (wasAnimating) animId = requestAnimationFrame(animate); else render();
    }

    function recordWebM() {
        if (!window.MediaRecorder) {
            alert('Recording not supported in this browser. Use Chrome or Edge.');
            return;
        }

        const fps         = parseInt(document.getElementById('rec-fps').value);
        const rawDuration = parseFloat(document.getElementById('rec-duration').value);
        const duration    = params.loopDuration > 0 ? params.loopDuration : rawDuration;
        const totalFrames = Math.round(duration * fps);
        const frameMs     = 1000 / fps;

        const wasAnimating = params.animate;
        params.animate = false;
        if (animId) cancelAnimationFrame(animId);
        const savedTime    = time;
        time = params.loopDuration > 0 ? 0 : savedTime;
        const savedQuality = params.quality;
        params.quality = 1.0;
        ensureBuffers(canvas.width, canvas.height);
        maskData = null;

        const mimeType = ['video/webm;codecs=vp9', 'video/webm']
            .find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';

        const stream     = canvas.captureStream(0);
        const videoTrack = stream.getVideoTracks()[0];
        const recorder   = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 12000000 });
        const chunks     = [];

        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
            triggerDownload(new Blob(chunks, { type: 'video/webm' }), 'flag-punch.webm');
            isRecording = false; activeRecorder = null;
            params.quality = savedQuality; maskData = null;
            time = savedTime; params.animate = wasAnimating;
            animWallStart = performance.now() - savedTime * 1000;
            updateRecordUI(0, 0);
            if (wasAnimating) animId = requestAnimationFrame(animate); else render();
        };

        isRecording    = true;
        activeRecorder = recorder;
        recorder.start();
        updateRecordUI(0, totalFrames);

        let frame = 0;
        function doFrame() {
            if (!isRecording || frame >= totalFrames) { recorder.stop(); return; }
            const t0 = performance.now();
            renderFrame(canvas.width, canvas.height);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(renderCanvas, 0, 0, canvas.width, canvas.height);
            videoTrack.requestFrame();
            frame++;
            time += 1 / fps;
            if (params.loopDuration > 0) time = time % params.loopDuration;
            updateRecordUI(frame, totalFrames);
            setTimeout(doFrame, Math.max(0, frameMs - (performance.now() - t0)));
        }
        doFrame();
    }

    function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a   = document.createElement('a');
        a.href     = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    function stopRecording() {
        isRecording = false;
        if (activeRecorder) activeRecorder.stop();
    }

    function updateRecordUI(frame, total) {
        const btn   = document.getElementById('rec-btn');
        const wrap  = document.getElementById('rec-progress-wrap');
        const bar   = document.getElementById('rec-progress-bar');
        const label = document.getElementById('rec-progress-label');
        if (total > 0 && frame <= total) {
            btn.textContent      = isRecording ? 'Cancel' : 'Record Video';
            btn.style.background = isRecording ? '#ff4444' : '';
            btn.style.color      = isRecording ? '#fff'    : '';
            wrap.style.display   = '';
            const pct = (frame / total * 100).toFixed(0);
            bar.style.width      = pct + '%';
            label.textContent    = `${frame} / ${total} frames  (${pct}%)`;
        } else {
            btn.textContent      = 'Record Video';
            btn.style.background = '';
            btn.style.color      = '';
            wrap.style.display   = 'none';
        }
    }

    document.getElementById('rec-duration').addEventListener('input', e => {
        document.getElementById('v-rec-dur').textContent = e.target.value;
    });
    // rec-fps needs no special wiring — read at record time

    // Pause rendering when the tab is hidden — no point heating the CPU off-screen
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (animId) cancelAnimationFrame(animId);
        } else if (params.animate && !isRecording) {
            animWallStart = performance.now() - time * 1000;
            lastFrameTime = 0;
            animId = requestAnimationFrame(animate);
        }
    });

    // ── Boot ─────────────────────────────────────────────────────────────────────
    document.fonts.load(`400 159px Doran`).then(() => {
        animWallStart = performance.now();
        animId = requestAnimationFrame(animate);
    });
</script>
</body>
</html>
